name: Dependabot auto-merge

# Merges Dependabot's grouped minor/patch PRs (dev deps, GitHub Actions) once
# the CI workflow has passed on them. Majors and runtime deps arrive on their
# own branches and are left for manual review.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/development-') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/actions-'))
    runs-on: ubuntu-latest
    steps:
      - name: Merge the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --author 'app/dependabot' --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "No open Dependabot PR for $BRANCH"; exit 0; fi
          # --match-head-commit: only merge exactly the commit CI passed on.
          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"
